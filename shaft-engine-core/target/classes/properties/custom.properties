# Custom SHAFT Engine team configurations and overrides
# Placed under src/main/resources/properties/custom.properties

targetBrowserName=chrome
headlessExecution=true
setParallel=METHODS
threadCount=4
retryMaximumNumberOfAttempts=1
forceCaptureSupportingEvidenceOnRetry=true
defaultElementIdentificationTimeout=30
waitForLazyLoadingTimeout=30
lazyLoadingNetworkIdleQuietWindowMillis=500
