<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>QA Engine</title>
<style>
  :root { --bg:#fbfbfc; --fg:#1b1b1f; --muted:#6b6b76; --card:#ffffff; --border:#e6e6ea; --accent:#5e6ad2; --accent-fg:#fff; --err:#dc2626; --danger:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e0f11; --fg:#ececef; --muted:#9a9aa5; --card:#16171a; --border:#26272b; --accent:#7c86e3; --accent-fg:#fff; --err:#f87171; --danger:#f87171; } }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font: 13px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing:antialiased; }
  .card { width:min(640px, calc(100vw - 32px)); padding:28px; border:1px solid var(--border); border-radius:12px; background:var(--card); box-shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04); }
  h1 { font-size:15px; font-weight:600; margin:0 0 4px; display:flex; align-items:center; gap:10px; }
  p { margin:0; color:var(--muted); }
  .spin { width:16px; height:16px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:s 0.8s linear infinite; }
  @keyframes s { to { transform:rotate(360deg) } }
  .failed .spin { display:none; }
  .failed h1 { color:var(--err); }
  pre { margin:16px 0 0; height:260px; overflow:auto; padding:12px; border-radius:8px; border:1px solid var(--border);
        background:var(--bg); font:11px/1.5 ui-monospace, Menlo, monospace; white-space:pre-wrap; word-break:break-all; }
  .actions { display:none; gap:8px; justify-content:flex-end; margin-top:16px; }
  .failed .actions { display:flex; }
  button { font:inherit; font-weight:500; height:32px; padding:0 12px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }

  .brand { display:flex; align-items:center; gap:8px; font-weight:600; font-size:13px; margin-bottom:20px; color:var(--fg); }
  .mark { width:22px; height:22px; border-radius:6px; background:var(--accent); display:grid; place-items:center; box-shadow:0 1px 2px rgba(0,0,0,.12); }
  .mark svg { width:13px; height:13px; fill:#fff; }
  button { transition: background .12s, border-color .12s; }
  button:hover { background: color-mix(in srgb, var(--fg) 5%, transparent); }
  button.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg></span>QA Engine</div>
    <h1><span class="spin"></span><span id="title">Starting QA Engine on this computer…</span></h1>
    <p id="sub">The first start takes a minute or two while the app compiles.</p>
    <pre id="log"></pre>
    <div class="actions">
      <button id="folder">Choose project folder…</button>
      <button id="server">Use another server…</button>
      <button id="retry" class="primary">Try again</button>
    </div>
  </div>
  <script src="starting.js"></script>
</body>
</html>
