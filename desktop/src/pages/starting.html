<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
<link rel="stylesheet" href="app.css">
<title>QA Engine</title>
<style>
  .failed .progress { display: none; }
  .failed #title { color: var(--danger); }
  .card:not(.failed) .actions { display: none; }
</style>
</head>
<body>
  <main class="center">
    <div class="card wide" id="card">
      <div class="brand"><span class="mark"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M213.85,125.46l-112,120a8,8,0,0,1-13.69-7l14.66-73.33L45.19,143.49a8,8,0,0,1-3-13l112-120a8,8,0,0,1,13.69,7L153.18,90.9l57.63,21.61a8,8,0,0,1,3,12.95Z"/></svg></span><span class="title-4">QA Engine</span></div>
      <div class="stack-8">
        <h1 class="heading-6" id="title">Starting QA Engine on this computer</h1>
        <p class="body-6" id="sub">The first start takes a minute or two while the app compiles.</p>
      </div>
      <div class="progress" role="progressbar" aria-label="Starting"></div>
      <div class="log-wrap">
        <pre class="log" id="log" aria-live="polite" aria-label="Start log"></pre>
        <div class="skel" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      </div>
      <div class="actions">
        <button id="folder">Choose project folder</button>
        <button id="server">Use another server</button>
        <button id="retry" class="primary">Try again</button>
      </div>
    </div>
  </main>
  <script src="starting.js"></script>
</body>
</html>
