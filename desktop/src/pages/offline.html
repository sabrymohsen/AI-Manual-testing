<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>QA Engine</title>
<style>
  :root { --bg:#fbfbfc; --fg:#1b1b1f; --muted:#6b6b76; --card:#ffffff; --border:#e6e6ea; --accent:#5e6ad2; --accent-fg:#fff; --err:#dc2626; --danger:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e0f11; --fg:#ececef; --muted:#9a9aa5; --card:#16171a; --border:#26272b; --accent:#7c86e3; --accent-fg:#fff; --err:#f87171; --danger:#f87171; } }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font: 13px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing:antialiased; -webkit-user-select:none; user-select:none; }
  .card { width:min(440px, calc(100vw - 32px)); padding:32px; border:1px solid var(--border); border-radius:12px; background:var(--card); box-shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04); text-align:center; }
  h1 { font-size:15px; font-weight:600; margin:0 0 6px; }
  p { margin:0 0 4px; color:var(--muted); }
  code { font-size:12px; color:var(--fg); word-break:break-all; }
  .reason { font-size:12px; margin-top:10px; }
  .actions { display:flex; gap:8px; justify-content:center; margin-top:22px; }
  button { font:inherit; font-weight:500; height:32px; padding:0 12px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  .brand { justify-content:center; display:flex; align-items:center; gap:8px; font-weight:600; font-size:13px; margin-bottom:20px; color:var(--fg); }
  .mark { width:22px; height:22px; border-radius:6px; background:var(--accent); display:grid; place-items:center; box-shadow:0 1px 2px rgba(0,0,0,.12); }
  .mark svg { width:13px; height:13px; fill:#fff; }
  button { transition: background .12s, border-color .12s; }
  button:hover { background: color-mix(in srgb, var(--fg) 5%, transparent); }
  button.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg></span>QA Engine</div>
    <h1>Can't reach QA Engine</h1>
    <p>Check your internet connection, then try again.</p>
    <p><code id="server"></code></p>
    <p class="reason" id="reason"></p>
    <div class="actions">
      <button id="change">Change server…</button>
      <button id="retry" class="primary">Try again</button>
    </div>
  </div>
  <script src="offline.js"></script>
</body>
</html>
