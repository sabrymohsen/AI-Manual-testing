<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>QA Engine</title>
<style>
  :root { --bg:#ffffff; --fg:#0f172a; --muted:#64748b; --card:#f8fafc; --border:#e2e8f0; --accent:#4f46e5; --accent-fg:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0f17; --fg:#e2e8f0; --muted:#94a3b8; --card:#111827; --border:#1f2937; --accent:#6366f1; } }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-user-select:none; user-select:none; }
  .card { width:min(440px, calc(100vw - 32px)); padding:32px; border:1px solid var(--border); border-radius:14px; background:var(--card); text-align:center; }
  h1 { font-size:18px; margin:0 0 6px; }
  p { margin:0 0 4px; color:var(--muted); }
  code { font-size:12px; color:var(--fg); word-break:break-all; }
  .reason { font-size:12px; margin-top:10px; }
  .actions { display:flex; gap:8px; justify-content:center; margin-top:22px; }
  button { font:inherit; padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Can't reach QA Engine</h1>
    <p>Check your internet connection, then try again.</p>
    <p><code id="server"></code></p>
    <p class="reason" id="reason"></p>
    <div class="actions">
      <button id="change">Change server…</button>
      <button id="retry" class="primary">Try again</button>
    </div>
  </div>
  <script src="offline.js"></script>
</body>
</html>
