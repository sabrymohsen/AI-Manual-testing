<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>Custom server</title>
<style>
  :root { --bg:#ffffff; --fg:#0f172a; --muted:#64748b; --border:#cbd5e1; --accent:#4f46e5; --danger:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0f17; --fg:#e2e8f0; --muted:#94a3b8; --border:#334155; --accent:#6366f1; --danger:#f87171; } }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size:16px; margin:0 0 4px; }
  p { margin:0 0 16px; color:var(--muted); }
  label { display:block; font-weight:600; margin-bottom:6px; }
  input { width:100%; font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--fg); }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .error { color:var(--danger); min-height:20px; font-size:12px; margin-top:6px; }
  .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
  button { font:inherit; padding:7px 14px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
</style>
</head>
<body>
  <h1>Connect to a custom server</h1>
  <p>Use this for a self-hosted QA Engine, or <code>http://localhost:3000</code> while developing.</p>
  <form id="form">
    <label for="url">Server URL</label>
    <input id="url" type="text" placeholder="https://qa.example.com" autofocus spellcheck="false" autocomplete="off">
    <div class="error" id="error" role="alert"></div>
    <div class="actions">
      <button type="button" id="cancel">Cancel</button>
      <button type="submit" class="primary">Connect</button>
    </div>
  </form>
  <script src="server.js"></script>
</body>
</html>
