<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
<link rel="stylesheet" href="app.css">
<title>Custom server</title>
<style>
  body { padding: 24px; background: var(--surface); }
  code { font-size: 12px; color: var(--fg); }
  form { margin-top: 24px; }
</style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M213.85,125.46l-112,120a8,8,0,0,1-13.69-7l14.66-73.33L45.19,143.49a8,8,0,0,1-3-13l112-120a8,8,0,0,1,13.69,7L153.18,90.9l57.63,21.61a8,8,0,0,1,3,12.95Z"/></svg></span><span class="title-4">QA Engine</span></div>
    <div class="stack-8">
      <h1 class="heading-6">Connect to a custom server</h1>
      <p class="body-6">Use this for a self hosted QA Engine, or <code>http://localhost:3000</code> while developing.</p>
    </div>
    <form id="form" novalidate>
      <label for="url" class="title-4">Server URL</label>
      <input id="url" type="text" placeholder="https://qa.example.com" autofocus spellcheck="false" autocomplete="off" aria-describedby="error">
      <div class="error" id="error" role="alert"></div>
      <div class="actions" style="margin-top:16px">
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" class="primary">Connect</button>
      </div>
    </form>
  </main>
  <script src="server.js"></script>
</body>
</html>
