<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Arabic text: use Noto Sans Arabic UI, not FreeMono (monospaced, letters don't join). -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Arabic UI</string></edit>
  </match>
  <alias><family>sans-serif</family><prefer><family>Liberation Sans</family><family>Noto Sans Arabic UI</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Liberation Serif</family><family>Noto Naskh Arabic UI</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Liberation Sans</family><family>Noto Sans Arabic UI</family></prefer></alias>
</fontconfig>
